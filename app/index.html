<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AzhunMart Business Desk</title>
<style>
:root{--ink:#172b4d;--muted:#64748b;--line:#e5eaf1;--bg:#f5f7fb;--blue:#2859c5;--teal:#0e8b78;--red:#c74646;--amber:#ad6b08;--card:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,Segoe UI,Arial,sans-serif}.shell{display:flex;min-height:100vh}.side{width:230px;background:#10284d;color:#fff;padding:24px 14px;flex-shrink:0}.brand{font-size:17px;font-weight:750;padding:0 12px 26px}.brand small{display:block;color:#a9bad6;font-size:11px;font-weight:500;margin-top:4px}.nav button{width:100%;border:0;background:none;color:#dbe5f5;text-align:left;padding:11px 12px;border-radius:9px;margin:2px 0;cursor:pointer;font-size:14px}.nav button.active,.nav button:hover{background:#234578;color:white}.sidefoot{position:sticky;top:95vh;font-size:11px;color:#9fb0c9;padding:22px 12px}.main{flex:1;min-width:0}.top{height:66px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:3}.top span{font-weight:650}.wrap{padding:26px 30px;max-width:1500px;margin:auto}.title{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;gap:15px}.title h1{margin:0;font-size:23px}.title p{color:var(--muted);margin:5px 0 0}.btn{border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink);padding:9px 13px;font-weight:600;cursor:pointer}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn.danger{color:var(--red)}.cards{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:13px;margin:18px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}.k{font-size:12px;color:var(--muted)}.v{font-size:23px;font-weight:720;margin-top:8px}.sub{font-size:11px;color:var(--muted);margin-top:5px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:17px;margin-bottom:15px}.panel h3{font-size:15px;margin:0 0 13px}.tablewrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:11px}table{border-collapse:collapse;width:100%;min-width:800px}th,td{text-align:left;padding:10px 11px;border-bottom:1px solid #edf0f4;white-space:nowrap}th{background:#f7f9fc;color:#50617b;font-size:11px;text-transform:uppercase;letter-spacing:.03em;position:sticky;top:0}td{font-size:13px}tr:last-child td{border-bottom:0}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#eef3fc;color:#355692;font-size:11px}.badge.green{background:#e4f5ee;color:#15724e}.badge.red{background:#fff0ed;color:#b13f32}.badge.amber{background:#fff4dd;color:#94600b}.actions{display:flex;gap:7px}.link{border:0;background:none;color:var(--blue);cursor:pointer;font-weight:600;padding:2px}.toolbar{display:flex;gap:9px;align-items:center;margin:12px 0}.toolbar input,.toolbar select{max-width:240px}.input,select,textarea{width:100%;padding:9px 10px;border:1px solid #d6deea;border-radius:7px;background:#fff;color:var(--ink);font:inherit}.input:focus,select:focus,textarea:focus{outline:2px solid #c4d5ff;border-color:#7898e6}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{font-size:12px;font-weight:650;color:#52627a;display:block;margin:0 0 5px}.field.full{grid-column:1/-1}.modal{position:fixed;inset:0;background:#10284d66;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.show{display:flex}.dialog{background:white;width:min(720px,100%);max-height:92vh;overflow:auto;border-radius:14px;padding:22px;box-shadow:0 25px 80px #10284d44}.dialog h2{margin:0 0 16px;font-size:19px}.dialogfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.notice{padding:12px 14px;border-radius:9px;background:#eef4ff;color:#34517d;font-size:12px;margin:12px 0}.empty{text-align:center;color:var(--muted);padding:35px}.bar{height:9px;background:#e8edf5;border-radius:10px;overflow:hidden}.bar i{height:100%;display:block;background:var(--teal)}.small{font-size:12px;color:var(--muted)}.rowhead{display:flex;justify-content:space-between;align-items:center}.dangertext{color:var(--red)}.footnote{margin-top:18px;color:#718096;font-size:11px}.hidden{display:none!important}
@media(max-width:850px){.side{width:62px;padding:15px 7px}.brand{font-size:0;padding:8px}.brand:before{content:'A';font-size:19px}.brand small,.nav button .lbl,.sidefoot{display:none}.nav button{font-size:0;text-align:center;padding:12px 5px}.nav button:after{content:attr(data-icon);font-size:17px}.wrap{padding:20px 14px}.top{padding:0 14px}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}@media(max-width:520px){.title{display:block}.title>.btn{margin-top:12px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.cards{gap:8px}.card{padding:12px}.v{font-size:19px}}
</style></head><body><div class="shell"><aside class="side"><div class="brand">AzhunMart<small>Business Desk · Offline first</small></div><nav class="nav" id="nav"></nav><div class="sidefoot">Personal workspace · data stays in this browser</div></aside><main class="main"><div class="top"><span id="topTitle">Overview</span><div class="actions"><button class="btn" id="backupBtn">Backup</button><button class="btn" id="restoreBtn">Restore</button><input type="file" id="restoreFile" accept="application/json" class="hidden"></div></div><div class="wrap" id="app"></div></main></div>
<div class="modal" id="modal"><div class="dialog"><div class="rowhead"><h2 id="modalTitle">Add record</h2><button class="btn" onclick="closeModal()">Close</button></div><div id="modalBody"></div><div class="dialogfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="saveBtn">Save</button></div></div></div>
<script>
const KEY='azhunmart-business-desk-v1';
const statuses=['New','Processing','Ready for Pickup','Picked Up','In Transit','Out for Delivery','Delivered','RTO','Undelivered','Cancelled'];
let db=load(),page='Dashboard',editId=null;
function blank(){return {orders:[],ads:[],rtos:[],expenses:[],stock:[{product:'Dua Sticker',variant:'Hindi',opening:0,purchases:0,reorder:10},{product:'Dua Sticker',variant:'English',opening:0,purchases:0,reorder:10}],settings:{cogs:108,websiteFee:9.47,codShip:120,prepaidShip:75,rtoFee:70}}}
function load(){try{return {...blank(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return blank()}}
function persist(){localStorage.setItem(KEY,JSON.stringify(db));render()}
const navItems=[['Dashboard','⌂'],['Orders','▤'],['Meta Ads','↗'],['RTO','↩'],['Stock','▦'],['Expenses','₹'],['Settings','⚙']];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return '₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:0,maximumFractionDigits:2})}
function dateToday(){return new Date().toISOString().slice(0,10)}
function id(){return crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random())}
function renderNav(){document.getElementById('nav').innerHTML=navItems.map(([n,ic])=>`<button data-icon="${ic}" class="${page===n?'active':''}" onclick="go('${n}')"><span class="lbl">${n}</span></button>`).join('')}
function go(p){page=p;render()}
function render(){renderNav();document.getElementById('topTitle').textContent=page;document.getElementById('app').innerHTML=page==='Dashboard'?dashboard():page==='Orders'?ordersPage():page==='Meta Ads'?adsPage():page==='RTO'?rtoPage():page==='Stock'?stockPage():page==='Expenses'?expensesPage():settingsPage()}
function profit(o){const ship=o.payment==='COD'?db.settings.codShip:db.settings.prepaidShip;const checkout=o.channel==='Website'?db.settings.websiteFee:0;const cost=(+o.qty||0)*(+db.settings.cogs||0);if(o.status==='Delivered')return (+o.price||0)*(+o.qty||0)-ship-checkout-cost;if(o.status==='RTO')return -ship-(+db.settings.rtoFee||0);return 0}
function costs(o){return o.payment==='COD'?db.settings.codShip:db.settings.prepaidShip}
function dashboard(){let delivered=db.orders.filter(o=>o.status==='Delivered'),spend=db.ads.reduce((a,x)=>a+(+x.spend||0),0),adorders=db.ads.reduce((a,x)=>a+(+x.orders||0),0),rtoLoss=db.orders.filter(o=>o.status==='RTO').reduce((a,o)=>a+costs(o)+(+db.settings.rtoFee||0),0),expense=db.expenses.reduce((a,x)=>a+(+x.amount||0),0),rev=delivered.reduce((a,o)=>a+(+o.price||0)*(+o.qty||0),0),orderProfit=delivered.reduce((a,o)=>a+profit(o),0),net=orderProfit-spend-rtoLoss-expense;let pending=db.orders.filter(o=>['New','Processing','Ready for Pickup','Picked Up','In Transit','Out for Delivery','Undelivered'].includes(o.status)).length;
return `<div class="title"><div><h1>Business overview</h1><p>Your daily business at a glance.</p></div><button class="btn primary" onclick="openForm('order')">＋ Add order</button></div><div class="cards">${metric('Orders',db.orders.length,'All orders entered')}${metric('Delivered sales',money(rev),delivered.length+' delivered')}${metric('Meta spend',money(spend),adorders?`${adorders} attributed orders · CAC ${money(spend/adorders)}`:'Enter attributed orders to see CAC')}${metric('Estimated net profit',money(net),'After ads, RTO shipping and expenses')}</div><div class="cards">${metric('In progress',pending,'Orders not yet delivered or closed')}${metric('RTO orders',db.orders.filter(o=>o.status==='RTO').length,'RTO loss '+money(rtoLoss))}${metric('Current stock',db.stock.reduce((a,s)=>a+stockOnHand(s),0),'Units across variants')}${metric('Other expenses',money(expense),'Excludes Meta spend')}</div><div class="grid2"><div class="panel"><h3>Recent orders</h3>${db.orders.length?table(['Order ID','Customer','Channel','Value','Status'],db.orders.slice(-6).reverse().map(o=>[esc(o.orderId),esc(o.name),esc(o.channel),money((+o.price||0)*(+o.qty||0)),badge(o.status)])):`<div class="empty">No orders yet. Add your first order.</div>`}</div><div class="panel"><h3>Quick start</h3><div class="small">1. Add orders from WhatsApp or your website.<br><br>2. Update the order status as it moves; enter AWB and delivery dates.<br><br>3. Add daily Meta spend and attributed order count.<br><br>4. Enter opening stock once. Add purchases as they arrive.<br><br>5. Use Backup regularly to download your data.</div></div></div><div class="notice">Data saves automatically in this browser on this device. Use <b>Backup</b> to save a copy; use Restore if you move browsers or devices.</div>`}
function metric(label,val,sub){return `<div class="card"><div class="k">${label}</div><div class="v">${val}</div><div class="sub">${sub}</div></div>`}
function badge(s){let cl=['Delivered','Paid'].includes(s)?'green':['RTO','Cancelled','Undelivered'].includes(s)?'red':['In Transit','Out for Delivery','Processing'].includes(s)?'amber':'';return `<span class="badge ${cl}">${esc(s||'—')}</span>`}
function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c??''}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function ordersPage(){let rows=[...db.orders].reverse().map(o=>{let duplicate=db.orders.some(x=>x.id!==o.id&&((o.mobile&&x.mobile===o.mobile)||(o.name&&x.name.toLowerCase()===o.name.toLowerCase())));return [esc(o.orderId),esc(o.date),esc(o.name),esc(o.channel),`${esc(o.product)} · ${esc(o.variant)}`,money((+o.price||0)*(+o.qty||0)),badge(o.status),duplicate?'<span class="badge red">Check duplicate</span>':'',`<span class="actions"><button class="link" onclick="edit('order','${o.id}')">Edit</button><button class="link dangertext" onclick="del('orders','${o.id}')">Delete</button></span>`]});return `<div class="title"><div><h1>Orders</h1><p>Website and WhatsApp orders in one list. Name/phone repeats are flagged for review.</p></div><button class="btn primary" onclick="openForm('order')">＋ Add order</button></div><div class="toolbar"><input class="input" placeholder="Search order, customer, phone" oninput="filterTable(this.value)"></div>${rows.length?table(['Logistics order ID','Date','Customer','Channel','Product','Value','Status','Alert',''],rows):'<div class="panel empty">No orders yet. Add your first order.</div>'}<div class="footnote">A repeat name or phone is a review alert; it may also be a legitimate repeat customer.</div>`}
function filterTable(q){document.querySelectorAll('.tablewrap tbody tr').forEach(tr=>tr.style.display=tr.innerText.toLowerCase().includes(q.toLowerCase())?'':'none')}
function adsPage(){let rows=[...db.ads].reverse().map(a=>[esc(a.date),esc(a.campaign),money(a.spend),a.orders||0,money(a.revenue),money((+a.spend||0)/(+a.orders||1)),`<button class="link" onclick="edit('ad','${a.id}')">Edit</button> <button class="link dangertext" onclick="del('ads','${a.id}')">Delete</button>`]);return `<div class="title"><div><h1>Meta Ads</h1><p>Enter the daily spend and orders you attribute to Meta to see CAC.</p></div><button class="btn primary" onclick="openForm('ad')">＋ Add daily report</button></div>${rows.length?table(['Date','Campaign','Spend','Attributed orders','Attributed revenue','CAC',''],rows):'<div class="panel empty">No ad records yet.</div>'}<div class="notice">CAC = ad spend ÷ attributed orders. Meta-reported attribution can differ from actual order source; enter the number you trust.</div>`}
function rtoPage(){let arr=db.orders.filter(o=>o.status==='RTO');let rows=arr.map(o=>[esc(o.orderId),esc(o.date),esc(o.name),esc(o.payment),money(costs(o)),money(db.settings.rtoFee),money(costs(o)+db.settings.rtoFee),esc(o.restocked?'Restocked':'Auto returned to stock')]);return `<div class="title"><div><h1>RTO</h1><p>RTO losses are calculated from the order’s payment type and status.</p></div></div><div class="cards">${metric('COD RTO loss',money((+db.settings.codShip)+(+db.settings.rtoFee)),'₹120 forward + ₹70 return')}${metric('Prepaid RTO loss',money((+db.settings.prepaidShip)+(+db.settings.rtoFee)),'₹75 forward + ₹70 return')}${metric('RTO orders',arr.length,'Set order status to RTO')}${metric('Total RTO loss',money(arr.reduce((a,o)=>a+costs(o)+(+db.settings.rtoFee),0)),'Included in estimated profit')}</div>${rows.length?table(['Order ID','Date','Customer','Payment','Forward ship','RTO fee','Total loss','Stock'],rows):'<div class="panel empty">No RTOs recorded. Change an order status to RTO when it returns.</div>'}<div class="notice">Set an order to RTO only after its return is confirmed. App automatically adds the quantity back to stock at that point.</div>`}
function stockOnHand(s){let reserved=db.orders.filter(o=>o.product===s.product&&o.variant===s.variant&&['Processing','Ready for Pickup','Picked Up','In Transit','Out for Delivery','Delivered'].includes(o.status)).reduce((a,o)=>a+(+o.qty||0),0);let back=db.orders.filter(o=>o.product===s.product&&o.variant===s.variant&&o.status==='RTO').reduce((a,o)=>a+(+o.qty||0),0);return (+s.opening||0)+(+s.purchases||0)-reserved+back}
function stockPage(){let rows=db.stock.map(s=>[esc(s.product),esc(s.variant),s.opening,s.purchases,db.orders.filter(o=>o.product===s.product&&o.variant===s.variant&&['Processing','Ready for Pickup','Picked Up','In Transit','Out for Delivery','Delivered'].includes(o.status)).reduce((a,o)=>a+(+o.qty||0),0),stockOnHand(s),(+stockOnHand(s)<=+(s.reorder||0)?'<span class="badge red">Low stock</span>':'<span class="badge green">OK</span>'),`<button class="link" onclick="edit('stock','${s.id}')">Edit</button>`]);return `<div class="title"><div><h1>Stock</h1><p>Set opening quantity once. Orders and RTO update stock automatically.</p></div><button class="btn" onclick="openForm('product')">＋ Add product/variant</button></div>${table(['Product','Variant','Opening stock','Purchases added','Reserved/sold','Current stock','Alert',''],rows)}<div class="notice">Stock reduces from Processing onward. When an order reaches RTO, its quantity is added back. Record purchases by editing “Purchases added”.</div>`}
function expensesPage(){let rows=[...db.expenses].reverse().map(x=>[esc(x.date),esc(x.category),esc(x.note),money(x.amount),`<button class="link" onclick="edit('expense','${x.id}')">Edit</button> <button class="link dangertext" onclick="del('expenses','${x.id}')">Delete</button>`]);return `<div class="title"><div><h1>Expenses</h1><p>Record business costs other than Meta ads and order shipping.</p></div><button class="btn primary" onclick="openForm('expense')">＋ Add expense</button></div>${rows.length?table(['Date','Category','Description','Amount',''],rows):'<div class="panel empty">No expenses yet.</div>'}`}
function settingsPage(){return `<div class="title"><div><h1>Settings</h1><p>Change business costs used in calculations.</p></div></div><div class="panel" style="max-width:650px"><h3>Cost assumptions</h3><div class="formgrid">${field('COGS per unit ₹','cogs',db.settings.cogs,'number')}${field('Website checkout fee ₹','websiteFee',db.settings.websiteFee,'number')}${field('COD shipping ₹','codShip',db.settings.codShip,'number')}${field('Prepaid shipping ₹','prepaidShip',db.settings.prepaidShip,'number')}${field('RTO fee ₹','rtoFee',db.settings.rtoFee,'number')}</div><button class="btn primary" style="margin-top:15px" onclick="saveSettings()">Save settings</button></div><div class="panel" style="max-width:650px"><h3>Your data</h3><p class="small">This version does not send data to a server or sync across devices. Download a backup regularly.</p><button class="btn" onclick="backup()">Download backup</button> <button class="btn danger" onclick="clearAll()">Clear all app data</button></div>`}
function field(label,name,val,type='text',opts=null,required=false){let inp=opts?`<select name="${name}" ${required?'required':''}>${opts.map(o=>`<option ${String(o)===String(val)?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input class="input" name="${name}" type="${type}" value="${esc(val)}" ${type==='number'?'step="0.01"':''} ${required?'required':''}>`;return `<div class="field"><label>${label}</label>${inp}</div>`}
function openForm(kind,obj=null){editId=obj?.id||null;let title,html;if(kind==='order'){title=obj?'Edit order':'Add order';html=`<div class="notice">Order ID is the logistics order ID from iThink/Shiprocket. Selling price is per unit.</div><form id="form" class="formgrid">${field('Logistics Order ID *','orderId',obj?.orderId||'','text',null,true)}${field('Order date','date',obj?.date||dateToday(),'date')}${field('Order source','channel',obj?.channel||'WhatsApp','text',['WhatsApp','Website'])}${field('Customer name','name',obj?.name||'')}${field('Mobile number','mobile',obj?.mobile||'','tel')}${field('Product','product',obj?.product||'Dua Sticker','text',db.stock.length?[...new Set(db.stock.map(s=>s.product))]:['Dua Sticker'])}${field('Variant','variant',obj?.variant||'Hindi','text',db.stock.filter(s=>s.product===(obj?.product||'Dua Sticker')).map(s=>s.variant))}${field('Quantity','qty',obj?.qty||1,'number',null,true)}${field('Payment type','payment',obj?.payment||'COD','text',['COD','Prepaid'])}${field('Selling price per unit ₹','price',obj?.price||'','number',null,true)}${field('Order status','status',obj?.status||'New','text',statuses)}${field('Payment status','paymentStatus',obj?.paymentStatus||'Pending','text',['Pending','Paid','Partially Refunded','Refunded'])}${field('AWB number','awb',obj?.awb||'')}${field('Estimated delivery','edd',obj?.edd||'','date')}${field('Delivered date','deliveredDate',obj?.deliveredDate||'','date')}${field('Notes','notes',obj?.notes||'')}</form>`}
else if(kind==='ad'){title=obj?'Edit Meta Ads record':'Add daily Meta Ads report';html=`<form id="form" class="formgrid">${field('Date','date',obj?.date||dateToday(),'date')}${field('Campaign (optional)','campaign',obj?.campaign||'')}${field('Ad spend ₹','spend',obj?.spend||'','number',null,true)}${field('Meta-attributed orders','orders',obj?.orders||0,'number')}${field('Attributed revenue ₹','revenue',obj?.revenue||0,'number')}</form>`}
else if(kind==='expense'){title=obj?'Edit expense':'Add expense';html=`<form id="form" class="formgrid">${field('Date','date',obj?.date||dateToday(),'date')}${field('Category','category',obj?.category||'Other','text',['Packaging','Software','Supplies','Travel','Other'])}${field('Amount ₹','amount',obj?.amount||'','number',null,true)}${field('Description','note',obj?.note||'')}</form>`}
else if(kind==='product'||kind==='stock'){title=obj?'Edit stock':'Add product or variant';html=`<form id="form" class="formgrid">${field('Product name','product',obj?.product||'')}${field('Variant','variant',obj?.variant||'')}${field('Opening stock','opening',obj?.opening||0,'number')}${field('Purchases added','purchases',obj?.purchases||0,'number')}${field('Low stock alert at','reorder',obj?.reorder||10,'number')}</form>`}
document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').classList.add('show');document.getElementById('saveBtn').onclick=()=>save(kind,obj)}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function edit(kind,key){let collection=kind==='order'?'orders':kind==='ad'?'ads':kind==='expense'?'expenses':'stock';let obj=db[collection].find(x=>x.id===key);openForm(kind,obj)}
function save(kind,obj){let f=document.getElementById('form');if(!f.reportValidity())return;let d=Object.fromEntries(new FormData(f).entries());for(let k in d)if(['qty','price','spend','orders','revenue','amount','opening','purchases','reorder'].includes(k))d[k]=Number(d[k]||0);let collection=kind==='order'?'orders':kind==='ad'?'ads':kind==='expense'?'expenses':'stock';if(kind==='order'){d.id=obj?.id||id();let dup=db.orders.find(x=>x.orderId===d.orderId&&x.id!==d.id);if(dup&&!confirm('This logistics Order ID already exists. Save anyway?'))return;if(d.status==='Delivered'&&!d.deliveredDate)d.deliveredDate=dateToday();}
else if(kind==='ad'||kind==='expense')d.id=obj?.id||id();else d.id=obj?.id||id();if(obj){let ix=db[collection].findIndex(x=>x.id===obj.id);db[collection][ix]=d}else db[collection].push(d);persist();closeModal()}
function del(collection,key){if(!confirm('Delete this record?'))return;db[collection]=db[collection].filter(x=>x.id!==key);persist()}
function saveSettings(){for(let k of ['cogs','websiteFee','codShip','prepaidShip','rtoFee'])db.settings[k]=Number(document.querySelector(`[name="${k}"]`).value||0);persist()}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='azhunmart-backup-'+dateToday()+'.json';a.click();URL.revokeObjectURL(a.href)}
document.getElementById('backupBtn').onclick=backup;document.getElementById('restoreBtn').onclick=()=>document.getElementById('restoreFile').click();document.getElementById('restoreFile').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let val=JSON.parse(r.result);if(!val.orders||!val.stock)throw 0;if(confirm('Restore backup? Current app data will be replaced.')){db={...blank(),...val};persist();alert('Backup restored.')}}catch{alert('Backup file is not valid.')}};r.readAsText(f)};
function clearAll(){if(confirm('Clear all saved orders, ads, stock and expenses from this browser? Download a backup first if needed.')){db=blank();persist()}}
render();
</script></body></html>
