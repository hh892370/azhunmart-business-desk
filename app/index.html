<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AzhunMart Business Desk</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--ink:#172b4d;--muted:#64748b;--line:#e5eaf1;--bg:#f5f7fb;--blue:#2859c5;--teal:#0e8b78;--red:#c74646}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,Segoe UI,Arial,sans-serif}.shell{display:flex;min-height:100vh}.side{width:220px;background:#10284d;color:#fff;padding:22px 13px;flex-shrink:0}.brand{font-size:17px;font-weight:750;padding:0 12px 22px}.brand small{display:block;color:#a9bad6;font-size:11px;margin-top:4px}.nav button{width:100%;border:0;background:none;color:#dbe5f5;text-align:left;padding:10px 12px;border-radius:8px;margin:2px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#234578;color:#fff}.main{flex:1;min-width:0}.top{height:62px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:2}.wrap{padding:24px;max-width:1450px;margin:auto}.title{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;gap:12px}.title h1{margin:0;font-size:23px}.title p{color:var(--muted);margin:5px 0 0}.btn{border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink);padding:9px 12px;font-weight:600;cursor:pointer}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn.danger{color:var(--red)}.cards{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:12px;margin:16px 0}.card,.panel{background:white;border:1px solid var(--line);border-radius:11px;padding:15px}.k{font-size:12px;color:var(--muted)}.v{font-size:22px;font-weight:720;margin-top:7px}.sub,.small{font-size:11px;color:var(--muted);margin-top:4px}.panel{margin-bottom:14px}.panel h3{font-size:15px;margin:0 0 12px}.tablewrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px}table{border-collapse:collapse;width:100%;min-width:760px}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid #edf0f4;white-space:nowrap;font-size:12px}th{background:#f7f9fc;color:#50617b;font-size:10px;text-transform:uppercase}tr:last-child td{border:0}.badge{display:inline-block;padding:3px 7px;border-radius:99px;background:#eef3fc;color:#355692;font-size:10px}.green{background:#e4f5ee;color:#15724e}.red{background:#fff0ed;color:#b13f32}.amber{background:#fff4dd;color:#94600b}.link{border:0;background:none;color:var(--blue);cursor:pointer;font-weight:600}.toolbar{display:flex;gap:8px;margin:10px 0}.input,select{width:100%;padding:9px;border:1px solid #d6deea;border-radius:7px;background:white;font:inherit}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{font-size:11px;font-weight:650;color:#52627a;display:block;margin-bottom:4px}.modal,.gate{position:fixed;inset:0;background:#10284d66;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.modal.show,.gate.show{display:flex}.dialog{background:#fff;width:min(700px,100%);max-height:92vh;overflow:auto;border-radius:13px;padding:20px}.notice{padding:10px 12px;border-radius:8px;background:#eef4ff;color:#34517d;font-size:12px;margin:10px 0}.empty{text-align:center;color:var(--muted);padding:28px}.foot{font-size:11px;color:var(--muted);margin-top:15px}.auth{background:#fff;width:min(430px,100%);padding:26px;border-radius:15px}.auth h1{font-size:22px;margin:0}.auth p{color:var(--muted);font-size:13px}.auth .field{margin:12px 0}.tabs{display:flex;gap:8px;margin:14px 0}.tabs button{flex:1}.msg{margin-top:10px;font-size:12px;color:#37588a}.dangerText{color:#ae342b}.row{display:flex;gap:8px;align-items:center}.hidden{display:none!important}@media(max-width:780px){.side{width:62px;padding:12px 6px}.brand{font-size:0;padding:8px}.brand:before{content:'A';font-size:20px}.brand small,.nav .lbl{display:none}.nav button{text-align:center;font-size:0;padding:11px 4px}.nav button:after{content:attr(data-i);font-size:17px}.wrap{padding:16px 12px}.top{padding:0 12px}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.formgrid{grid-template-columns:1fr}.cards{gap:7px}.card{padding:11px}.v{font-size:18px}.title{display:block}.title .btn{margin-top:9px}}
</style></head><body>
<div class="gate show" id="gate"><div class="auth"><h1>AzhunMart Business Desk</h1><p>Secure login · Cloud save · AI advisor</p><div id="configBox"><div class="notice">First-time setup: enter your Supabase Project URL and publishable/anon key. These are project identifiers; never enter a service-role key here.</div><div class="field"><label>Supabase Project URL</label><input class="input" id="cfgUrl" placeholder="https://your-project.supabase.co"></div><div class="field"><label>Publishable / anon key</label><input class="input" id="cfgKey" placeholder="sb_publishable_… or legacy anon key"></div><button class="btn primary" style="width:100%" onclick="saveConfig()">Connect</button></div><div id="loginBox" class="hidden"><div class="tabs"><button class="btn" onclick="authMode='signin';renderAuthMode()">Log in</button><button class="btn" onclick="authMode='signup';renderAuthMode()">Create account</button></div><div class="field"><label>Email</label><input class="input" id="email" type="email" autocomplete="username"></div><div class="field"><label>Password</label><input class="input" id="password" type="password" autocomplete="current-password"></div><button class="btn primary" style="width:100%" onclick="authenticate()" id="authBtn">Log in</button><div class="msg" id="authMsg"></div><button class="link" style="margin-top:12px" onclick="resetConfig()">Change connection settings</button></div></div></div>
<div class="shell hidden" id="shell"><aside class="side"><div class="brand">AzhunMart<small>Business Desk · Cloud</small></div><nav id="nav" class="nav"></nav></aside><main class="main"><div class="top"><b id="topTitle">Dashboard</b><div class="row"><span class="small" id="syncState">Connected</span><button class="btn" onclick="backup()">Backup</button><button class="btn" onclick="logout()">Log out</button></div></div><div id="app" class="wrap"></div></main></div>
<div class="modal" id="modal"><div class="dialog"><div class="row" style="justify-content:space-between"><h2 id="mtitle"></h2><button class="btn" onclick="closeModal()">Close</button></div><div id="mbody"></div><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="saveBtn">Save</button></div></div></div>
<script>
const CFGKEY='azhunmart-cloud-config-v1',settingsDefault={cogs:108,websiteFee:9.47,codShip:120,prepaidShip:75,rtoFee:70};let sb=null,user=null,db={orders:[],ads:[],stock:[],expenses:[],settings:{...settingsDefault}},page='Dashboard',authMode='signin',busy=false,cloudSnapshot=null,queue=Promise.resolve();
const pages=[['Dashboard','⌂'],['Orders','▤'],['Meta Ads','↗'],['RTO','↩'],['Stock','▦'],['Expenses','₹'],['AI Advisor','✦'],['Settings','⚙']];
const colmap={orders:{table:'orders',fields:['id','orderId','date','channel','name','mobile','product','variant','qty','payment','price','status','paymentStatus','awb','edd','deliveredDate','notes']},ads:{table:'ad_daily',fields:['id','date','campaign','spend','orders','revenue']},stock:{table:'stock_items',fields:['id','product','variant','opening','purchases','reorder']},expenses:{table:'expenses',fields:['id','date','category','note','amount']}};
function toSnake(x){return Object.fromEntries(Object.entries(x).map(([k,v])=>[k.replace(/[A-Z]/g,m=>'_'+m.toLowerCase()),v]))}function fromSnake(x){return Object.fromEntries(Object.entries(x).map(([k,v])=>[k.replace(/_([a-z])/g,(_,m)=>m.toUpperCase()),v]))}function uuid(){return crypto.randomUUID()}
function setMsg(t){let e=document.getElementById('authMsg');if(e)e.textContent=t}
function renderAuthMode(){document.getElementById('authBtn').textContent=authMode==='signin'?'Log in':'Create account';document.getElementById('password').autocomplete=authMode==='signin'?'current-password':'new-password'}
function saveConfig(){let url=document.getElementById('cfgUrl').value.trim(),key=document.getElementById('cfgKey').value.trim();if(!/^https:\/\//.test(url)||!key)return alert('Project URL aur publishable/anon key dono chahiye.');localStorage.setItem(CFGKEY,JSON.stringify({url,key}));location.reload()}
function resetConfig(){if(confirm('Connection settings change karne se sign out hoga. Continue?')){localStorage.removeItem(CFGKEY);location.reload()}}
function init(){let c=JSON.parse(localStorage.getItem(CFGKEY)||'null');if(!c)return;document.getElementById('configBox').classList.add('hidden');document.getElementById('loginBox').classList.remove('hidden');sb=window.supabase.createClient(c.url,c.key);sb.auth.getSession().then(({data})=>{if(data.session){user=data.session.user;startApp()}else document.getElementById('gate').classList.add('show')});sb.auth.onAuthStateChange((event,session)=>{if(session&&(!user||user.id!==session.user.id)){user=session.user;setTimeout(()=>startApp(),0)}if(!session&&user){user=null;setTimeout(showGate,0)}})}
async function authenticate(){let email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password)return setMsg('Email aur password daalo.');setMsg('Please wait…');let res=authMode==='signin'?await sb.auth.signInWithPassword({email,password}):await sb.auth.signUp({email,password});if(res.error)return setMsg(res.error.message);if(authMode==='signup'&&!res.data.session)return setMsg('Confirmation email check karo, phir login karo.');user=res.data.user;startApp()}
async function logout(){await sb.auth.signOut();user=null;showGate()}function showGate(){document.getElementById('shell').classList.add('hidden');document.getElementById('gate').classList.add('show')}
async function startApp(){document.getElementById('gate').classList.remove('show');document.getElementById('shell').classList.remove('hidden');document.getElementById('syncState').textContent='Loading cloud data…';try{await loadCloud();if(!db.stock.length){db.stock=[{id:uuid(),product:'Dua Sticker',variant:'Hindi',opening:0,purchases:0,reorder:10},{id:uuid(),product:'Dua Sticker',variant:'English',opening:0,purchases:0,reorder:10}];cloudSnapshot=JSON.stringify({...db,stock:[]});enqueueSave()}render();document.getElementById('syncState').textContent='Saved to cloud'}catch(e){document.getElementById('syncState').textContent='Sync error';alert('Cloud data load error: '+e.message)}}
async function loadCloud(){for(const [key,c] of Object.entries(colmap)){const {data,error}=await sb.from(c.table).select('*').order('created_at',{ascending:true,nullsFirst:true});if(error)throw error;db[key]=data.map(fromSnake)}let {data,error}=await sb.from('app_settings').select('value').maybeSingle();if(error)throw error;db.settings={...settingsDefault,...(data?.value||{})};cloudSnapshot=JSON.stringify(db)}
function enqueueSave(){if(!sb||!user)return;document.getElementById('syncState').textContent='Saving…';queue=queue.then(async()=>{const before=JSON.parse(cloudSnapshot||'{"orders":[],"ads":[],"stock":[],"expenses":[],"settings":{}}');for(const [key,c] of Object.entries(colmap)){let old=before[key]||[],now=db[key]||[],oldIds=new Set(old.map(x=>x.id)),nowIds=new Set(now.map(x=>x.id));let removed=[...oldIds].filter(id=>!nowIds.has(id));if(removed.length){let {error}=await sb.from(c.table).delete().in('id',removed);if(error)throw error}let changed=now.filter(x=>!oldIds.has(x.id)||JSON.stringify(x)!==JSON.stringify(old.find(y=>y.id===x.id)));if(changed.length){let {error}=await sb.from(c.table).upsert(changed.map(toSnake));if(error)throw error}}if(JSON.stringify(before.settings)!==JSON.stringify(db.settings)){let {error}=await sb.from('app_settings').upsert({user_id:user.id,value:db.settings});if(error)throw error}cloudSnapshot=JSON.stringify(db);document.getElementById('syncState').textContent='Saved to cloud'}).catch(e=>{document.getElementById('syncState').textContent='Save failed';console.error(e);alert('Cloud save failed: '+e.message+' Please do not close this page until retrying.')})}
function persist(){render();enqueueSave()}
function safe(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(x){return '₹'+Number(x||0).toLocaleString('en-IN',{maximumFractionDigits:2})}function today(){return new Date().toISOString().slice(0,10)}
function profit(o){let ship=o.payment==='COD'?+db.settings.codShip:+db.settings.prepaidShip,fee=o.channel==='Website'?+db.settings.websiteFee:0,cost=(+o.qty||0)*(+db.settings.cogs||0),rev=(+o.price||0)*(+o.qty||0);return o.status==='Delivered'?rev-ship-fee-cost:o.status==='RTO'?-ship-(+db.settings.rtoFee||0):0}
function stockQty(s){let reserved=db.orders.filter(o=>o.product===s.product&&o.variant===s.variant&&['Processing','Ready for Pickup','Picked Up','In Transit','Out for Delivery','Delivered'].includes(o.status)).reduce((a,o)=>a+(+o.qty||0),0),rto=db.orders.filter(o=>o.product===s.product&&o.variant===s.variant&&o.status==='RTO').reduce((a,o)=>a+(+o.qty||0),0);return (+s.opening||0)+(+s.purchases||0)-reserved+rto}
function badge(s){let c=['Delivered','Paid'].includes(s)?'green':['RTO','Cancelled','Undelivered'].includes(s)?'red':['Processing','In Transit','Out for Delivery'].includes(s)?'amber':'';return `<span class="badge ${c}">${safe(s||'—')}</span>`}
function metric(a,b,c){return `<div class="card"><div class="k">${a}</div><div class="v">${b}</div><div class="sub">${c}</div></div>`}
function table(h,rows){return `<div class="tablewrap"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x??''}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function dashboard(){let done=db.orders.filter(o=>o.status==='Delivered'),sp=db.ads.reduce((a,x)=>a+(+x.spend||0),0),cnt=db.ads.reduce((a,x)=>a+(+x.orders||0),0),rto=db.orders.filter(o=>o.status==='RTO'),rev=done.reduce((a,o)=>a+(+o.price||0)*(+o.qty||0),0),net=done.reduce((a,o)=>a+profit(o),0)-sp-rto.reduce((a,o)=>a+(o.payment==='COD'?+db.settings.codShip:+db.settings.prepaidShip)+(+db.settings.rtoFee),0)-db.expenses.reduce((a,x)=>a+(+x.amount||0),0);let rows=[...db.orders].slice(-7).reverse().map(o=>[safe(o.orderId),safe(o.name),safe(o.channel),money(o.price*o.qty),badge(o.status)]);return `<div class="title"><div><h1>Business overview</h1><p>Sales, ads, delivery and profit.</p></div><button class="btn primary" onclick="openForm('order')">＋ Add order</button></div><div class="cards">${metric('Orders',db.orders.length,'Recorded orders')}${metric('Delivered sales',money(rev),done.length+' delivered')}${metric('Meta Ads spend',money(sp),cnt?`${cnt} ad orders · CAC ${money(sp/cnt)}`:'Enter attributed orders for CAC')}${metric('Estimated net profit',money(net),'After ads, shipping, RTO and expenses')}</div><div class="cards">${metric('In progress',db.orders.filter(o=>['New','Processing','Ready for Pickup','Picked Up','In Transit','Out for Delivery'].includes(o.status)).length,'Open orders')}${metric('RTO loss',money(rto.reduce((a,o)=>a+(o.payment==='COD'?+db.settings.codShip:+db.settings.prepaidShip)+(+db.settings.rtoFee),0)),rto.length+' RTO')}${metric('Current stock',db.stock.reduce((a,s)=>a+stockQty(s),0),'Add opening stock in Stock')}${metric('Other expenses',money(db.expenses.reduce((a,x)=>a+(+x.amount||0),0)),'Excludes Meta Ads')}</div><div class="panel"><h3>Recent orders</h3>${rows.length?table(['Order ID','Customer','Channel','Value','Status'],rows):'<div class="empty">No orders yet. Add your first one.</div>'}</div>`}
function ordersPage(){let rows=[...db.orders].reverse().map(o=>{let dup=db.orders.some(x=>x.id!==o.id&&((o.mobile&&x.mobile===o.mobile)||(o.name&&x.name?.toLowerCase()===o.name.toLowerCase())));return [safe(o.orderId),safe(o.date),safe(o.name),safe(o.channel),safe(o.product)+' · '+safe(o.variant),money(o.price*o.qty),badge(o.status),dup?'<span class="badge red">Check duplicate</span>':'',`<button class="link" onclick="edit('order','${o.id}')">Edit</button> <button class="link dangerText" onclick="del('orders','${o.id}')">Delete</button>`]});return `<div class="title"><div><h1>Orders</h1><p>Website + WhatsApp orders. Possible repeated phone/name is flagged.</p></div><button class="btn primary" onclick="openForm('order')">＋ Add order</button></div>${rows.length?table(['Logistics Order ID','Date','Customer','Channel','Product','Value','Status','Alert',''],rows):'<div class="panel empty">No orders yet.</div>'}`}
function adsPage(){let rows=[...db.ads].reverse().map(a=>[safe(a.date),safe(a.campaign),money(a.spend),a.orders,money(a.revenue),money(+a.spend/(+a.orders||1)),`<button class="link" onclick="edit('ad','${a.id}')">Edit</button> <button class="link" onclick="del('ads','${a.id}')">Delete</button>`]);return `<div class="title"><div><h1>Meta Ads</h1><p>Enter daily spend and orders attributed to Meta.</p></div><button class="btn primary" onclick="openForm('ad')">＋ Add daily report</button></div>${rows.length?table(['Date','Campaign','Spend','Orders','Revenue','CAC',''],rows):'<div class="panel empty">No ad records.</div>'}`}
function rtoPage(){let arr=db.orders.filter(o=>o.status==='RTO');return `<div class="title"><div><h1>RTO</h1><p>RTO loss auto-calculates from order status and payment type.</p></div></div><div class="cards">${metric('COD RTO loss',money(+db.settings.codShip+ +db.settings.rtoFee),'forward + return')}${metric('Prepaid RTO loss',money(+db.settings.prepaidShip+ +db.settings.rtoFee),'forward + return')}${metric('RTO count',arr.length,'RTO orders')}${metric('Total loss',money(arr.reduce((a,o)=>a+(o.payment==='COD'?+db.settings.codShip:+db.settings.prepaidShip)+ +db.settings.rtoFee,0)),'Included in profit')}</div>${arr.length?table(['Order ID','Date','Customer','Payment','Loss','Stock'],arr.map(o=>[safe(o.orderId),safe(o.date),safe(o.name),safe(o.payment),money((o.payment==='COD'?+db.settings.codShip:+db.settings.prepaidShip)+ +db.settings.rtoFee),'Added back automatically'])):'<div class="panel empty">No RTO orders.</div>'}`}
function stockPage(){return `<div class="title"><div><h1>Stock</h1><p>Enter opening stock once. Orders/RTO update quantities automatically.</p></div><button class="btn" onclick="openForm('stock')">＋ Add product/variant</button></div>${table(['Product','Variant','Opening','Purchases','Reserved/sold','Current stock','Status',''],db.stock.map(s=>[safe(s.product),safe(s.variant),s.opening,s.purchases,db.orders.filter(o=>o.product===s.product&&o.variant===s.variant&&['Processing','Ready for Pickup','Picked Up','In Transit','Out for Delivery','Delivered'].includes(o.status)).reduce((a,o)=>a+(+o.qty||0),0),stockQty(s),stockQty(s)<=s.reorder?'<span class="badge red">Low stock</span>':'<span class="badge green">OK</span>',`<button class="link" onclick="edit('stock','${s.id}')">Edit</button>`]))}<div class="notice">Opening stock is required for a meaningful balance. RTO adds its quantity back after the status is set to RTO.</div>`}
function expensesPage(){return `<div class="title"><div><h1>Expenses</h1><p>Enter business costs other than Meta Ads and order shipping.</p></div><button class="btn primary" onclick="openForm('expense')">＋ Add expense</button></div>${db.expenses.length?table(['Date','Category','Description','Amount',''],[...db.expenses].reverse().map(x=>[safe(x.date),safe(x.category),safe(x.note),money(x.amount),`<button class="link" onclick="edit('expense','${x.id}')">Edit</button> <button class="link" onclick="del('expenses','${x.id}')">Delete</button>`])):'<div class="panel empty">No expenses yet.</div>'}`}
function aiPage(){return `<div class="title"><div><h1>Gemini Business Advisor</h1><p>Uses recent business totals; customer names and numbers are not sent.</p></div><button class="btn primary" onclick="runAI()">✦ Get advice</button></div><div class="panel" id="aiOut"><div class="notice">AI connection becomes active after the secure Edge Function and GEMINI_API_KEY are set up.</div></div>`}
function settingsPage(){return `<div class="title"><div><h1>Settings</h1><p>Business costs used by the profit and RTO calculations.</p></div></div><div class="panel" style="max-width:620px"><div class="formgrid">${field('COGS per unit ₹','cogs',db.settings.cogs)}${field('Website checkout fee ₹','websiteFee',db.settings.websiteFee)}${field('COD shipping ₹','codShip',db.settings.codShip)}${field('Prepaid shipping ₹','prepaidShip',db.settings.prepaidShip)}${field('RTO fee ₹','rtoFee',db.settings.rtoFee)}</div><button class="btn primary" style="margin-top:13px" onclick="saveSettings()">Save</button></div><div class="panel"><b>Cloud connection</b><p class="small">Signed in as ${safe(user?.email)} · data belongs to this account.</p></div>`}
function field(label,name,val,type='text',opts=null,req=false){return `<div class="field"><label>${label}</label>${opts?`<select name="${name}" ${req?'required':''}>${opts.map(x=>`<option ${String(x)===String(val)?'selected':''}>${safe(x)}</option>`).join('')}</select>`:`<input class="input" name="${name}" type="${type}" value="${safe(val)}" ${type==='number'?'step="0.01"':''} ${req?'required':''}>`}</div>`}
function render(){document.getElementById('topTitle').textContent=page;document.getElementById('nav').innerHTML=pages.map(([n,i])=>`<button data-i="${i}" class="${page===n?'active':''}" onclick="go('${n}')"><span class="lbl">${n}</span></button>`).join('');document.getElementById('app').innerHTML=page==='Dashboard'?dashboard():page==='Orders'?ordersPage():page==='Meta Ads'?adsPage():page==='RTO'?rtoPage():page==='Stock'?stockPage():page==='Expenses'?expensesPage():page==='AI Advisor'?aiPage():settingsPage()}
function go(p){page=p;render()}
function openForm(kind,obj=null){let html,title;if(kind==='order'){title=obj?'Edit order':'Add order';html=`<div class="notice">Use iThink/Shiprocket logistics Order ID. Selling price is per unit.</div><form id="form" class="formgrid">${field('Logistics Order ID *','orderId',obj?.orderId||'','text',null,true)}${field('Date','date',obj?.date||today(),'date')}${field('Channel','channel',obj?.channel||'WhatsApp','text',['WhatsApp','Website'])}${field('Customer name','name',obj?.name||'')}${field('Mobile','mobile',obj?.mobile||'','tel')}${field('Product','product',obj?.product||'Dua Sticker','text',[...new Set([...db.stock.map(x=>x.product),'Dua Sticker'])])}${field('Variant','variant',obj?.variant||'Hindi','text',db.stock.filter(x=>x.product===(obj?.product||'Dua Sticker')).map(x=>x.variant).concat(db.stock.length?[]:['Hindi','English']))}${field('Quantity','qty',obj?.qty||1,'number',null,true)}${field('Payment','payment',obj?.payment||'COD','text',['COD','Prepaid'])}${field('Price per unit ₹','price',obj?.price||'','number',null,true)}${field('Status','status',obj?.status||'New','text',['New','Processing','Ready for Pickup','Picked Up','In Transit','Out for Delivery','Delivered','RTO','Undelivered','Cancelled'])}${field('Payment status','paymentStatus',obj?.paymentStatus||'Pending','text',['Pending','Paid','Partially Refunded','Refunded'])}${field('AWB','awb',obj?.awb||'')}${field('EDD','edd',obj?.edd||'','date')}${field('Delivered date','deliveredDate',obj?.deliveredDate||'','date')}${field('Notes','notes',obj?.notes||'')}</form>`}else if(kind==='ad'){title=obj?'Edit ad report':'Add daily Meta Ads';html=`<form id="form" class="formgrid">${field('Date','date',obj?.date||today(),'date')}${field('Campaign','campaign',obj?.campaign||'')}${field('Spend ₹','spend',obj?.spend||'','number',null,true)}${field('Attributed orders','orders',obj?.orders||0,'number')}${field('Attributed revenue ₹','revenue',obj?.revenue||0,'number')}</form>`}else if(kind==='expense'){title=obj?'Edit expense':'Add expense';html=`<form id="form" class="formgrid">${field('Date','date',obj?.date||today(),'date')}${field('Category','category',obj?.category||'Other','text',['Packaging','Software','Supplies','Travel','Other'])}${field('Amount ₹','amount',obj?.amount||'','number',null,true)}${field('Description','note',obj?.note||'')}</form>`}else{title=obj?'Edit stock':'Add product/variant';html=`<form id="form" class="formgrid">${field('Product','product',obj?.product||'Dua Sticker')}${field('Variant','variant',obj?.variant||'Hindi')}${field('Opening stock','opening',obj?.opening||0,'number')}${field('Purchases added','purchases',obj?.purchases||0,'number')}${field('Low stock at','reorder',obj?.reorder||10,'number')}</form>`}document.getElementById('mtitle').textContent=title;document.getElementById('mbody').innerHTML=html;document.getElementById('modal').classList.add('show');document.getElementById('saveBtn').onclick=()=>save(kind,obj)}
function closeModal(){document.getElementById('modal').classList.remove('show')}function edit(kind,key){let coll=kind==='order'?'orders':kind==='ad'?'ads':kind==='expense'?'expenses':'stock';openForm(kind,db[coll].find(x=>x.id===key))}
function save(kind,obj){let f=document.getElementById('form');if(!f.reportValidity())return;let d=Object.fromEntries(new FormData(f).entries());for(let k of ['qty','price','spend','orders','revenue','amount','opening','purchases','reorder'])if(d[k]!==undefined)d[k]=Number(d[k]||0);let c=kind==='order'?'orders':kind==='ad'?'ads':kind==='expense'?'expenses':'stock';d.id=obj?.id||uuid();if(kind==='order'){if(db.orders.some(o=>o.id!==d.id&&o.orderId===d.orderId)&&!confirm('Duplicate logistics Order ID. Save anyway?'))return;if(d.status==='Delivered'&&!d.deliveredDate)d.deliveredDate=today()}if(obj){let i=db[c].findIndex(x=>x.id===obj.id);db[c][i]=d}else db[c].push(d);closeModal();persist()}
function del(c,id){if(!confirm('Delete this record?'))return;db[c]=db[c].filter(x=>x.id!==id);persist()}
function saveSettings(){for(let k of ['cogs','websiteFee','codShip','prepaidShip','rtoFee'])db.settings[k]=Number(document.querySelector(`[name="${k}"]`).value||0);persist()}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='azhunmart-cloud-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}
async function runAI(){let el=document.getElementById('aiOut');el.innerHTML='Generating advice…';let orderData=db.orders.map(o=>({date:o.date,channel:o.channel,product:o.product,variant:o.variant,qty:o.qty,payment:o.payment,value:(+o.price||0)*(+o.qty||0),status:o.status,profit:profit(o)}));let spend=db.ads.reduce((a,x)=>a+(+x.spend||0),0),adOrders=db.ads.reduce((a,x)=>a+(+x.orders||0),0);let summary={period:'all recorded data',orderCount:db.orders.length,deliveredSales:db.orders.filter(o=>o.status==='Delivered').reduce((a,o)=>a+(+o.price||0)*(+o.qty||0),0),rtoCount:db.orders.filter(o=>o.status==='RTO').length,adSpend:spend,metaAttributedOrders:adOrders,estimatedCAC:adOrders?spend/adOrders:null,expenses:db.expenses.reduce((a,x)=>a+(+x.amount||0),0),stock:db.stock.map(s=>({product:s.product,variant:s.variant,onHand:stockQty(s)})),orders:orderData};let {data,error}=await sb.functions.invoke('business-advisor',{body:{summary}});if(error){el.innerHTML=`<div class="notice">AI setup/error: ${safe(error.message)}. Check Edge Function deployment and GEMINI_API_KEY secret.</div>`;return}el.innerHTML=`<div class="panel">${safe(data.advice||'No advice returned.').replace(/\n/g,'<br>')}</div>`}
window.go=go;window.openForm=openForm;window.closeModal=closeModal;window.saveConfig=saveConfig;window.renderAuthMode=renderAuthMode;window.authenticate=authenticate;window.resetConfig=resetConfig;window.logout=logout;window.edit=edit;window.del=del;window.saveSettings=saveSettings;window.backup=backup;window.runAI=runAI;
init();
</script></body></html>
